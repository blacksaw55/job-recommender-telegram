name: Daily 7 AM Telegram AI Job Recommendation Digest

on:
  schedule:
    # 7:00 AM IST is 1:30 AM UTC (30 1 * * *)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  recommend-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run AI Job Recommendation & Telegram Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js send-now
